; Board builds. Unit tests do NOT run through PlatformIO -- the core is plain
; C++17 with no Arduino.h, so it builds under CMake on the host and CI runs
; ctest against it. See CMakeLists.txt and .github/workflows/ci.yml.
;
; The Uno R4 Minima is the reference target: 32 KB of SRAM is what keeps the
; representation honest. Everything is proven there first. See dev/PLAN.md.

[platformio]
default_envs = uno_r4_minima
; The board build compiles src/ alongside the portable core. CMake builds the
; same core/ on the host for the tests; neither knows about the other.
src_dir = firmware

[env]
framework = arduino
; -I core so the portable core's headers are written the same way here as they
; are under CMake: "graph/state.h", never a bare filename. The grouping is only
; worth having if the include lines show it.
build_flags = -std=gnu++17 -Wall -Wextra -Ifirmware/core
build_unflags = -std=gnu++11
; Trailing slash means recursive, which the core now needs -- it has one
; directory per concern rather than one flat pile. hal/ holds one file per
; board, each guarded by its own architecture macro, so every env compiles the
; directory and only one implementation survives the preprocessor.
build_src_filter = +<src/> +<core/> +<hal/>
; No lib_deps, and specifically no ArduinoJson, which this file used to say would
; arrive with the protocol codec. ArduinoJson 7 removed StaticJsonDocument and
; moved string storage to the heap, so the current library cannot satisfy this
; project's no-dynamic-allocation rule, and 6 is no longer maintained. The codec
; carries its own reader and writer instead -- see firmware/core/json.h.

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
; Sized for 32 KB SRAM. A graph exceeding any of these is refused at upload with
; a message naming what overflowed -- never at trial 300.
build_flags = ${env.build_flags}
  -DSTATEMACHINED_MAX_STATES=32
  -DSTATEMACHINED_MAX_TRANSITIONS=64
  -DSTATEMACHINED_MAX_OUTPUT_ACTIONS=64
  -DSTATEMACHINED_MAX_DISTRIBUTIONS=32
  ; 255 is where the type stops the count: path_len is a uint8_t. 4080 B of the
  ; 32 KB against 64's 1024, and it buys a trial whose path is complete rather
  ; than truncated. See firmware/core/config.h.
  -DSTATEMACHINED_MAX_PATH=255

; The same board, with the host on SCI2 (D0/D1) instead of USB CDC. Two uses,
; and only one of them is testing: it is what Renode runs, because tinyusb
; against an emulated USBFS is the most fragile thing in that picture and the
; point is to test our code -- and it is the build for a rig that wants a
; hardware serial bridge. See emulation/README.md.
[env:uno_r4_minima_sci]
extends = env:uno_r4_minima
build_flags = ${env:uno_r4_minima.build_flags} -DSTATEMACHINED_LINK_UART

[env:teensy41]
platform = teensy
board = teensy41
build_flags = ${env.build_flags}
  -DSTATEMACHINED_MAX_STATES=256
  -DSTATEMACHINED_MAX_TRANSITIONS=512
  -DSTATEMACHINED_MAX_OUTPUT_ACTIONS=512
  -DSTATEMACHINED_MAX_DISTRIBUTIONS=128
  ; 255, not 1024. This said 1024 and could not: path_len is a uint8_t, so the
  ; comparison in record_visit never terminated at 1024 and kMaxPath itself
  ; narrowed. A static_assert in config.h now refuses the mistake rather than
  ; leaving it to be found on a board. Raising it for real is a type change
  ; reaching every struct and the wire format.
  -DSTATEMACHINED_MAX_PATH=255

[env:esp32]
platform = espressif32
board = esp32dev
; WiFi and BT stay off in the trial loop -- triald's PLAN.md says so and it is
; right. Pin the engine to one core; flash operations stall interrupts.
build_flags = ${env.build_flags}
  -DSTATEMACHINED_MAX_STATES=128
  -DSTATEMACHINED_MAX_TRANSITIONS=256
  -DSTATEMACHINED_MAX_OUTPUT_ACTIONS=256
  -DSTATEMACHINED_MAX_DISTRIBUTIONS=64
  ; 255, for the reason the Teensy's is. See config.h.
  -DSTATEMACHINED_MAX_PATH=255
