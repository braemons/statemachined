// SPDX-License-Identifier: GPL-3.0-or-later
//
// The link between the daemon and the board: protobuf, carried in COBS frames
// with a CRC-16. `docs/reference/protocol.md` is the prose; this file is the
// shape, and both ends are generated from it — nanopb on the board, a
// descriptor the daemon reads at run time.
//
// This is not the API. `proto/statemachined/v1/` is what clients see; this is
// what a microcontroller with 32 KB of SRAM sees. The package is separate so
// the two can never share a message by accident.
//
// **The names are the NDJSON wire's.** A `oneof body` member is named for the
// `msg_type` it replaces, and every field keeps its member name, so the
// daemon's own messages — a `msg_type` and a map of fields — cross unchanged
// and only the codec below them moved. An enum value is the old token in upper
// case behind its enum's prefix: `ACTION_KIND_TIMER_START` is `"timer_start"`.
//
// Rules the shapes follow:
//
// - **Every size is bounded.** Each repeated and string field has a nanopb
//   limit in `firmware/core/proto/link.options`, so the board decodes into
//   fixed-size structs and nothing through a callback.
// - **No floating point**, in any value that crosses this wire.
// - **`optional` where absence means something.** A plain field that is not
//   sent reads as zero; a field is `optional` when "not sent" has to be told
//   apart from zero — `terminal` on a state that is not terminal, a timer's
//   `loops` whose absence means one and whose zero means forever.
// - **Unknown fields are ignored and an unknown `body` is refused** with
//   `error` / `unknown_type`. A new field is how the protocol grows without a
//   version bump.
syntax = "proto3";

package statemachined.link.v1;

// ---------------------------------------------------------------- envelopes ---
//
// **The registry of message types, not an encoded message.** A frame's payload
// is a fixed header -- `type`, `flags`, `message_id` and, from the board,
// `in_reply_to` (docs/reference/protocol.md §1) -- and then the body alone,
// encoded as its own message. `type` is the body's field number here.
//
// It used to be this envelope, encoded, with the body as a `oneof` member. That
// cost the board more than anything else it did: nanopb walks every member of
// the `oneof` to encode one, and encodes a nested message twice (once to size
// it), so a `pong` cost five times its own encode. The shape is kept because it
// is still the one place that says which number is which message, and because
// nanopb's union of the bodies is exactly the struct the board decodes into.

// Everything the daemon sends is one of these.
message HostMessage {
  oneof body {
    Hello hello = 10;
    SetBegin set_begin = 11;
    SetEnd set_end = 12;
    GraphBegin graph_begin = 13;
    GraphDist graph_dist = 14;
    GraphState graph_state = 15;
    GraphTransition graph_transition = 16;
    GraphAction graph_action = 17;
    GraphTimer graph_timer = 18;
    GraphEnd graph_end = 19;
    Configure configure = 20;
    Start start = 21;
    Cancel cancel = 22;
    Ping ping = 23;
    StateRequest state = 24;
    Wiring wiring = 25;
    Timers timers = 26;
    Pins pins = 27;
    Autorun autorun = 28;
    Save save = 29;
    Profile profile = 30;
  }
}

// Everything the board sends is one of these.
message DeviceMessage {
  oneof body {
    HelloAck hello_ack = 10;
    Ack ack = 11;
    SetOk set_ok = 12;
    Armed armed = 13;
    Started started = 14;
    CancelAck cancel_ack = 15;
    ResultBegin result_begin = 16;
    ResultPath result_path = 17;
    ResultEnd result_end = 18;
    Event event = 19;
    Error error = 20;
    Log log = 21;
    Pong pong = 22;
    StateReport state_report = 23;
    Visit visit = 24;
    PinMap pin_map = 25;
    AutorunOk autorun_ok = 26;
    Saved saved = 27;
    ProfileReport profile_report = 28;
  }
}

// ------------------------------------------------------------ host → device ---

message Hello {
  // Protocol version. **2**: the NDJSON wire was 1.
  uint32 proto = 1;
  // The session seed. Every per-trial stream is derived from it and the
  // `trial_id`. A 64-bit integer at last, rather than the hex string a JSON
  // number could not carry.
  uint64 seed = 2;
}

message SetBegin {
  uint32 set_version = 1;
  uint32 n_graphs = 2;
}

message SetEnd {
  uint32 n_states = 1;
  uint32 n_transitions = 2;
  uint32 n_output_actions = 3;
  // CRC-16/CCITT-FALSE over the protobuf bytes of every upload message since
  // `set_begin`, `set_begin` included and this one excluded. Catches a missing
  // message, which no per-frame CRC can see.
  uint32 checksum = 4;
}

message GraphBegin {
  uint32 slot = 1;
  uint32 n_states = 2;
  // Within this graph.
  uint32 entry = 3;
}

enum DistKind {
  DIST_KIND_UNSPECIFIED = 0;
  DIST_KIND_FIXED = 1;
  DIST_KIND_UNIFORM = 2;
  DIST_KIND_EXPONENTIAL = 3;
  DIST_KIND_CHOICE = 4;
}

message GraphDist {
  uint32 i = 1;
  DistKind kind = 2;
  // Milliseconds. What each means depends on `kind`: see §3.2.
  sint32 a = 3;
  sint32 b = 4;
  sint32 c = 5;
  // `choice` only.
  repeated sint32 opts = 6;
  // `choice` only, and optional: empty means every option weighs 1.
  repeated uint32 weights = 7;
}

message Timeout {
  // A distribution, set-global.
  uint32 dist = 1;
  // A state, within this graph.
  uint32 target = 2;
}

message GraphState {
  uint32 i = 1;
  // The outcome code this state reports. Absent on a state that is not
  // terminal.
  optional sint32 terminal = 2;
  optional Timeout timeout = 3;
  // Terminal states only: the distribution the dwell before another run is
  // drawn from. Absent means none.
  optional uint32 relight = 4;
}

message GraphTransition {
  uint32 all = 1;
  uint32 any = 2;
  uint32 none = 3;
  uint32 target = 4;
  // A distribution. Absent means the predicate fires the scan it holds.
  optional uint32 hold = 5;
  bool level = 6;
}

enum ActionOn {
  ACTION_ON_UNSPECIFIED = 0;
  ACTION_ON_ENTRY = 1;
  ACTION_ON_EXIT = 2;
}

enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  ACTION_KIND_HIGH = 1;
  ACTION_KIND_LOW = 2;
  ACTION_KIND_TOGGLE = 3;
  ACTION_KIND_PULSE = 4;
  ACTION_KIND_TIMER_START = 5;
  ACTION_KIND_TIMER_CANCEL = 6;
}

message GraphAction {
  ActionOn on = 1;
  // An output line. Not read by the timer kinds.
  uint32 line = 2;
  ActionKind kind = 3;
  // `pulse` only.
  uint32 ms = 4;
  // `timer_start` / `timer_cancel` only.
  uint32 timer = 5;
}

message GraphTimer {
  uint32 i = 1;
  uint32 width = 2;
  optional uint32 delay = 3;
  optional uint32 gap = 4;
  optional uint32 line = 5;
  // Absent means 1; 0 runs until something stops it.
  optional uint32 loops = 6;
  uint32 all = 7;
  uint32 any = 8;
  uint32 none = 9;
  bool active_low = 10;
  bool trial_bound = 11;
}

message GraphEnd {
  uint32 n_transitions = 1;
  uint32 n_output_actions = 2;
}

enum StartSource {
  START_SOURCE_UNSPECIFIED = 0;
  START_SOURCE_SERIAL = 1;
  START_SOURCE_LINE = 2;
  START_SOURCE_BOTH = 3;
}

message Patch {
  uint32 i = 1;
  optional sint32 a = 2;
  optional sint32 b = 3;
  optional sint32 c = 4;
}

message Configure {
  uint32 trial_id = 1;
  uint32 set_version = 2;
  uint32 graph_index = 3;
  sint32 cap_ms = 4;
  // Unspecified is `serial`.
  StartSource start = 5;
  // Required when `start` admits a line.
  optional uint32 start_line = 6;
  // Absent leaves the device's own mask in force.
  optional uint32 timers = 7;
  repeated Patch patch = 8;
}

message Start {
  uint32 trial_id = 1;
}

enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  CANCEL_REASON_HOST = 1;
  CANCEL_REASON_LINK_LOST = 2;
  CANCEL_REASON_ABORT_LINE = 3;
  CANCEL_REASON_TRIAL_TIMEOUT = 4;
}

message Cancel {
  uint32 trial_id = 1;
  // Only `host` is the host's to give. Unspecified is `host`.
  CancelReason reason = 2;
}

message Ping {}

message StateRequest {}

message Wiring {
  optional uint32 invert = 1;
  optional uint32 enable = 2;
  optional uint32 safe = 3;
  // Per input line, index = line. Empty leaves the table alone; anything else
  // replaces all of it, and the lines it does not name get 0.
  repeated uint32 debounce_ms = 4;
}

message Timers {
  uint32 enable = 1;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_IN = 1;
  DIRECTION_OUT = 2;
}

message Pins {
  Direction dir = 1;
}

message Autorun {
  // Absent makes this a question: nothing changes, and the settings are
  // reported.
  optional bool enabled = 1;
  optional uint32 graph_index = 2;
  optional sint32 cap_ms = 3;
  optional uint64 seed = 4;
  optional uint32 first_trial_id = 5;
  // Absent means true.
  optional bool start_now = 6;
}

message Save {}

// Where the board's time goes: a profiling build's cycle counts, read out and
// optionally cleared. Every build answers it; one compiled without
// STATEMACHINED_PROFILE answers `enabled: false` and nothing else. For
// measuring a board (client/python/tests/perf), not for a session: the daemon
// never sends it. See firmware/core/profile/profile.h.
message Profile {
  // Clear the figures instead of reporting them: the reply carries `enabled`
  // and `cycles_per_second` only, so the reset costs no more than a ping and
  // what it costs is not the first thing the fresh profile measures.
  bool reset = 1;
}

// ------------------------------------------------------------ device → host ---

message Caps {
  // The longest frame the board accepts, in encoded bytes including the
  // delimiter.
  uint32 max_frame = 1;
  uint32 max_states = 2;
  uint32 max_transitions = 3;
  uint32 max_output_actions = 4;
  uint32 max_distributions = 5;
  uint32 max_choice_options = 6;
  uint32 max_path = 7;
  uint32 max_graphs = 8;
  uint32 max_timers = 9;
  uint32 first_timer_line = 10;
}

message HelloAck {
  uint32 proto = 1;
  string board = 2;
  string fw = 3;
  uint32 n_input_lines = 4;
  uint32 n_output_lines = 5;
  uint32 scan_hz = 6;
  Caps caps = 7;
  bool has_set = 8;
  uint32 set_version = 9;
  uint32 n_graphs = 10;
  bool has_wiring = 11;
}

message Ack {
  // A reply to `timers` only: the mask the device now holds, and how many
  // timers the committed set declares.
  optional uint32 enable = 1;
  optional uint32 n_timers = 2;
}

message SetOk {
  uint32 set_version = 1;
  uint32 n_graphs = 2;
  uint32 n_states = 3;
  uint32 n_transitions = 4;
  uint32 n_output_actions = 5;
}

message Armed {
  uint32 trial_id = 1;
  uint32 set_version = 2;
  uint32 graph_index = 3;
}

message Started {
  uint32 trial_id = 1;
  uint32 at_us = 2;
  // `serial` or `line`.
  StartSource by = 3;
  // The line, when `by` is `line`.
  optional uint32 line = 4;
}

message CancelAck {
  uint32 trial_id = 1;
  bool cancelled = 2;
  sint32 outcome = 3;
}

enum ExitCause {
  EXIT_CAUSE_UNSPECIFIED = 0;
  EXIT_CAUSE_TIMEOUT = 1;
  EXIT_CAUSE_TRANSITION = 2;
  EXIT_CAUSE_CANCEL = 3;
  EXIT_CAUSE_TERMINAL = 4;
}

message ResultBegin {
  uint32 trial_id = 1;
  sint32 outcome = 2;
  uint32 cancel_reason = 3;
  uint32 total_us = 4;
  uint32 path_len = 5;
  uint32 first_seq = 6;
  uint32 total_visits = 7;
  bool truncated = 8;
}

// Rows of the path, as parallel packed arrays rather than a repeated message:
// each field of a row at index `i` is element `i` of its array, and every
// array is the same length. A repeated message costs nanopb a sizing pass per
// row, and this is the largest burst the board sends. A row is what `visit`
// carries: the state, why it was left (`exit`), which transition fired (255
// for an exit that was not one), the realised draw in ms, and the device
// clock at entry and the time spent.
message ResultPath {
  uint32 trial_id = 1;
  uint32 from = 2;
  repeated uint32 state = 3;
  repeated ExitCause exit = 4;
  repeated uint32 transition = 5;
  repeated sint32 drawn_ms = 6;
  repeated uint32 entered_us = 7;
  repeated uint32 duration_us = 8;
}

message ResultEnd {
  uint32 trial_id = 1;
  // CRC-16/CCITT-FALSE over the protobuf bytes of `result_begin` and every
  // `result_path`, in order.
  uint32 checksum = 2;
}

message Event {
  uint32 us = 1;
  uint32 word = 2;
}

message Error {
  string code = 1;
  string message = 2;
  string context = 3;
}

message Log {
  string level = 1;
  string message = 2;
}

message Pong {
  uint32 up_us = 1;
  uint32 us = 2;
}




// Flat, on purpose: the three groups it had -- graph, io, scan -- were nested
// messages, each of which nanopb encodes twice, in the reply a host polls for.
message StateReport {
  uint32 link_state = 1;
  bool has_wiring = 2;
  bool autorun = 3;
  uint32 trial_id = 4;
  bool running = 5;
  uint32 current_state = 6;
  uint32 up_us = 7;
  // Frames the board threw away whole: too long, not COBS, or a CRC that did
  // not match.
  uint32 dropped_lines = 8;
  // Frames that arrived intact and still could not be read as a message.
  uint32 bad_lines = 9;
  // The committed set, and which of its graphs is live.
  bool has_set = 10;
  uint32 set_version = 11;
  uint32 n_graphs = 12;
  uint32 graph_index = 13;
  // The live pins: inputs as read, outputs as driven.
  uint32 in = 14;
  uint32 out = 15;
  // Is this device keeping up: its measured scan rate, the scan periods that
  // went by with no scan, the longest run of them, replies that waited for the
  // wire, visits the ring had no room for, and the timers enabled and running.
  uint32 scan_hz = 16;
  uint32 overruns = 17;
  uint32 worst_gap = 18;
  uint32 tx_stalls = 19;
  uint32 visits_dropped = 20;
  uint32 timers_enabled = 21;
  uint32 timers_running = 22;
}

// One completed state visit, sent as it happens. Flat: the row's fields are
// the message's, as in `result_path`.
message Visit {
  uint32 trial_id = 1;
  uint32 seq = 2;
  // Within the graph.
  uint32 state = 3;
  ExitCause exit = 4;
  // Which of this state's transitions fired, or 255 for an exit that was not
  // one.
  uint32 transition = 5;
  // The realised draw, in ms.
  sint32 drawn_ms = 6;
  // Device clock.
  uint32 entered_us = 7;
  uint32 duration_us = 8;
}

message PinMap {
  Direction dir = 1;
  uint32 n = 2;
  repeated string pins = 3;
}

message AutorunOk {
  bool enabled = 1;
  bool active = 2;
  uint32 graph_index = 3;
  sint32 cap_ms = 4;
  uint32 next_trial_id = 5;
}

message Saved {
  bool has_set = 1;
  uint32 set_version = 2;
  bool autorun = 3;
  uint32 write_count = 4;
  bool written = 5;
}

// One measured region; `span` is profile::Span in firmware/core/profile.
message ProfileSpan {
  uint32 span = 1;
  uint32 count = 2;
  uint64 total_cycles = 3;
  uint32 max_cycles = 4;
}

message ProfileReport {
  // False from a build without profiling, which reports nothing else.
  bool enabled = 1;
  // What a cycle is worth: the core clock on a board.
  uint32 cycles_per_second = 2;
  // Every span, including the ones that never ran.
  repeated ProfileSpan spans = 3;
  // Overruns while a trial was running -- the ones that cost an experiment.
  uint32 overruns_in_trial = 4;
  uint32 worst_gap_in_trial = 5;
  // The sizes of the structs every frame clears and fills, which are fixed by
  // link.options: what one decode and one reply cost before any field is set.
  uint32 host_message_bytes = 6;
  uint32 device_message_bytes = 7;
}
