syntax = "proto3";

package statemachined.v1;

// The box's own settings: which device, and how this daemon talks to it.
//
// **The rig configuration, never a state-machine config.** The two are
// unrelated and both were once called "config": this one changes when the
// hardware does and lives in `/etc/braemons`, and a state-machine config is
// one experiment's graphs and line map and changes per session. Every name
// here says which.
message RigConfiguration {
  // The board. A serial path, or a `socket://` URL for one on a switch or the
  // native build.
  string device_target = 1;
  int32 device_baud = 2;
  double device_timeout_seconds = 3;

  // Refuse a board that is not this one. Empty accepts whatever answers, which
  // is right for a bench and wrong for a rig with four of them on a bench
  // beside it.
  string expected_board = 4;

  bool connect_on_startup = 5;

  // A config to load when the daemon starts, so a rig comes back up loaded
  // rather than waiting for somebody to notice.
  string startup_state_machine_config = 6;

  // `set` uploads every graph once and selects per trial; `per_trial` uploads
  // one each time. The first is how a session runs and the second is how a
  // board too small for the set still runs it.
  string graph_mode = 7;

  int32 trace_ring_entries = 8;
  double heartbeat_seconds = 9;

  // Where things are written. Empty `recording_directory` means nothing is
  // recorded, which is right for a bench and wrong for a rig — so this says
  // which it is rather than failing at the first `Recording/Start`.
  string trace_directory = 10;
  string graph_store_directory = 11;
  string recording_directory = 12;
  string state_machine_config_directory = 13;
}

// Change it, and do whatever the change implies.
//
// **Until the daemon restarts.** This does not write `/etc/braemons`, on
// purpose: a rig's configuration is a file somebody owns and reviews, and an
// API that rewrote it would make the running daemon the authority on what the
// box is. Every field is `optional`, so absent means "leave it alone".
message RigConfigurationPatch {
  optional string device_target = 1;
  optional int32 device_baud = 2;
  optional string expected_board = 3;
  optional string graph_mode = 4;
  optional string startup_state_machine_config = 5;
}

message RigConfigurationUpdate {
  RigConfiguration configuration = 1;

  // Whether the change reopened the link, which a changed `device_target`
  // does.
  bool reconnected = 2;

  // Always true, and said out loud: nothing here survives a restart.
  bool until_restart = 3;
}
