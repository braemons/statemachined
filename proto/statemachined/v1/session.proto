syntax = "proto3";

package statemachined.v1;

import "statemachined/v1/device.proto";

// What this rig is loaded with, and whether a session is open.
//
// **Three separate facts, reported separately rather than collapsed into one
// `ready` flag**, because the useful question at two in the morning is *which*
// of them is missing: a config may be loaded with no session open, and a set
// may be committed on the board from a session that ended — which is normal,
// and is what makes a reconnect cheap.
message SessionState {
  // The loaded state-machine config, or nothing.
  LoadedStateMachineConfig state_machine_config = 1 [json_name = "state_machine_config"];

  // The graph set the board is holding, which may be from a session that has
  // already ended.
  CommittedGraphSet committed_set = 2 [json_name = "committed_set"];

  // Whether a session is open on this connection.
  bool session_open = 3 [json_name = "session_open"];

  // When it was opened, and how long ago. Absent when none is.
  //
  // `open_seconds` is computed here rather than left to a caller: a browser's
  // clock and a rig's are not the same clock, and "open for 4 minutes" worked
  // out from a timestamp difference across them is a number that goes negative
  // on a box whose NTP has not settled.
  optional double opened_at_unix_seconds = 6 [json_name = "opened_at_unix_seconds"];
  optional double open_seconds = 7 [json_name = "open_seconds"];

  // Which graph a trial gets when it names none. Empty when nothing is
  // selected, in which case a trial must name one.
  string active_graph = 4 [json_name = "active_graph"];

  // Every config in the store, by name, so a panel can offer them without a
  // second call.
  repeated string stored_config_names = 5 [json_name = "stored_config_names"];
}

message LoadedStateMachineConfig {
  string name = 1;
  string description = 2;
  string board = 3;
  repeated string graph_names = 4 [json_name = "graph_names"];

  // Whether the config this rig is running is still in the store. A loaded
  // config can be deleted while it is loaded, and the rig keeps running it —
  // saying so is better than implying the store is the only place it exists.
  bool still_in_the_store = 5 [json_name = "still_in_the_store"];
}

// Put the loaded config's graphs on the device.
//
// **The slowest call in this API by a wide margin, and the one where a session
// is allowed to fail**: a graph that does not fit this board fails here, with
// an animal not yet in the booth, rather than at trial 40.
message OpenSessionResult {
  string state_machine_config = 1 [json_name = "state_machine_config"];
  int32 set_version = 2 [json_name = "set_version"];

  // Which slot each graph landed in. A caller never needs this — everything
  // else in this API takes a name — but it is what a person compares against
  // the board when a trial reports the wrong graph.
  map<string, int32> slots = 3;

  GraphPoolCounts pool_usage = 4 [json_name = "pool_usage"];
  GraphPoolCounts pool_capacity = 5 [json_name = "pool_capacity"];
  int32 elapsed_milliseconds = 6 [json_name = "elapsed_milliseconds"];
}

// Which graph a trial gets when it names none.
// What closing a session did, beside the session it left behind.
//
// **Closing cancels an armed trial**, and that is the one act it performs on
// the board rather than in its own bookkeeping: an armed trial with nobody
// driving it is a rig that will run one more trial at whatever time somebody
// next touches a lever. Which trial that was is a fact the record needs, so it
// is answered rather than only traced.
//
// `was_open` distinguishes closing a session from closing nothing. Neither is
// an error — closing twice is fine — and a caller that wanted to know which it
// did could not tell from a `SessionState` that says `session_open: false`
// either way.
message CloseSessionResult {
  bool was_open = 1 [json_name = "was_open"];
  optional int64 cancelled_trial_id = 2 [json_name = "cancelled_trial_id"];

  // The session as it now stands, so nothing has to read it back.
  SessionState session = 3;
}

message SetActiveGraphRequest {
  string graph = 1;
}

message ActiveGraph {
  // Empty when nothing is selected.
  string active_graph = 1 [json_name = "active_graph"];
}

// What loading a state-machine config did.
message LoadedConfigResult {
  string loaded = 1;

  // Whether the wiring reached the board. A config loads with nothing
  // attached — the line map is applied here and pushed when there is
  // something to push.
  bool wiring_pushed = 2 [json_name = "wiring_pushed"];

  LineMapView line_map = 3 [json_name = "line_map"];
  repeated string graph_names = 4 [json_name = "graph_names"];
}
