syntax = "proto3";

package statemachined.v1;

// What one board can hold, as `hello_ack` declares it.
//
// **Read from the device, never assumed.** The reference board ships more than
// one image and a Teensy is a different set of numbers again, so compiling
// against a constant would mean a graph that fits in the tests and not on the
// bench.
message DeviceCapacities {
  int32 max_line = 1 [json_name = "max_line"];
  int32 max_states = 2 [json_name = "max_states"];
  int32 max_transitions = 3 [json_name = "max_transitions"];
  int32 max_output_actions = 4 [json_name = "max_output_actions"];
  int32 max_distributions = 5 [json_name = "max_distributions"];
  int32 max_choice_options = 6 [json_name = "max_choice_options"];
  int32 max_path = 7 [json_name = "max_path"];
  int32 max_graphs = 8 [json_name = "max_graphs"];
  int32 max_timers = 9 [json_name = "max_timers"];

  // Which input line the first global timer holds high. Not derivable from the
  // line count: the timers are counted down from the top of the word, so that
  // a graph means the same thing on a board with eight inputs and one with
  // twenty. The device reports it because nothing else can know it.
  int32 first_timer_line = 10 [json_name = "first_timer_line"];

  int32 input_line_count = 11 [json_name = "input_line_count"];
  int32 output_line_count = 12 [json_name = "output_line_count"];
}

// What a graph set costs a board, pool by pool.
//
// **Six numbers and not one**, because a board has six pools and they fill
// independently: a set can be two states short of the limit with room for
// forty more transitions. One total would say "it does not fit" without
// saying what to cut, which is the only part somebody setting up a session
// can act on.
//
// The same message carries usage and capacity, so the two are read the same
// way and a panel puts them side by side without arithmetic. A pool the
// firmware adds is a field added here, which is a diff a reviewer sees.
message GraphPoolCounts {
  int32 graphs = 1;
  int32 states = 2;
  int32 transitions = 3;
  int32 output_actions = 4 [json_name = "output_actions"];
  int32 distributions = 5;
  int32 choice_options = 6 [json_name = "choice_options"];
}

// The graph set the board is holding right now.
message CommittedGraphSet {
  int32 set_version = 1 [json_name = "set_version"];
  repeated string graph_names = 2 [json_name = "graph_names"];
  GraphPoolCounts pool_usage = 3 [json_name = "pool_usage"];
  GraphPoolCounts pool_capacity = 4 [json_name = "pool_capacity"];
}

// How the serial link is behaving.
message LinkHealth {
  // How many times this daemon has opened the link since it started. A rig
  // whose count climbs on its own has a cable or a power problem, and the
  // number is the only thing that says so.
  int32 connection_count = 1 [json_name = "connection_count"];
  int64 dropped_lines = 2 [json_name = "dropped_lines"];
  int64 bad_lines = 3 [json_name = "bad_lines"];
  string last_error = 4 [json_name = "last_error"];
}

// Whether the board is keeping to its scan period.
//
// **Diagnosis rather than control, and the honest half of the timing claim.**
// A board that quietly misses scans looks exactly like one that is fine, so a
// missed scan is counted and reported.
message ScanHealth {
  // The rate the board is actually achieving, measured by the board.
  int32 hz = 1;

  // Scans that took longer than the period. The number that makes a timing
  // claim honest: a board quietly missing scans looks exactly like one that is
  // fine.
  int64 overruns = 2;

  // The worst gap seen, in scan periods.
  int32 worst_gap = 3 [json_name = "worst_gap"];

  // Times the board had something to say and could not, because the link was
  // not draining. A rig whose `tx_stalls` climbs is losing trace entries at
  // the far end rather than on the board.
  int64 tx_stalls = 4 [json_name = "tx_stalls"];
}

// Everything about the attachment, in one answer.
message DeviceState {
  bool connected = 1;

  // Where the daemon is told to look: a serial path, or a `socket://` URL for
  // a board on a switch or the native build.
  string target = 2;

  string board = 3;
  string firmware_version = 4 [json_name = "firmware_version"];
  int32 protocol_version = 5 [json_name = "protocol_version"];
  int32 measured_scan_hz = 6 [json_name = "measured_scan_hz"];

  DeviceCapacities capacities = 7;

  // Whether the board has a wiring table of its own. Absent when nothing has
  // said either way, which is a different thing from "no".
  optional bool has_wiring = 8 [json_name = "has_wiring"];

  // Whether this daemon knows which pin each line is **because the board said
  // so**, or because it assumed. `docs/reference/protocol.md` §3.6, and the
  // whole reason that command exists: before it, there was no third answer to
  // "which pin is line 4" beyond a table copied out of the firmware.
  string pin_labels_came_from = 9 [json_name = "pin_labels_came_from"];

  CommittedGraphSet committed_set = 10 [json_name = "committed_set"];
  LinkHealth link = 11;
  ScanHealth scan = 12;

  int64 uptime_device_microseconds = 13 [json_name = "uptime_device_microseconds"];
}

// One input line: what it is called, how the rig conditions it, and what it
// reads right now.
message InputLine {
  string name = 1;

  // Which bit of the input word this is — the only part of a line that reaches
  // the device. Absent when the map named a pin instead and there was no board
  // to resolve it against; a line configured by pin reports the index it will
  // actually be uploaded with as soon as one is attached.
  optional int32 line_index = 2 [json_name = "line_index"];

  // The board's own name for that pin, which is what a person checks against
  // the hardware.
  string pin_label = 3 [json_name = "pin_label"];

  // Reads active-low. Opto-isolated inputs routinely do, and it is applied
  // when the word is assembled so that no predicate above it has a special
  // case.
  bool reads_active_low = 4 [json_name = "reads_active_low"];

  // A disabled line reads zero however the pin is driven, which is how a rig
  // says "nothing is plugged in there" without every graph having to avoid
  // naming it.
  bool is_enabled = 5 [json_name = "is_enabled"];

  // How long a change must hold before it is believed. Per line rather than
  // per predicate, because a predicate over several lines is what chatters
  // worst: two lines each bouncing once can make a combination rise and fall
  // several times, and no care in the graph can filter that afterwards.
  //
  // In the view because it is part of the wiring somebody is looking at. It
  // was left out of the first cut of this message, which made a rig's
  // debouncing invisible to every reader of `ReadLines`.
  int32 debounce_milliseconds = 7 [json_name = "debounce_milliseconds"];

  // Its level right now, from the device's own `io` word. **The only way
  // anything outside the device can check that a graph's line numbers reach
  // the pins somebody wired** — there is no read-back path from a pin. Absent
  // when nothing is attached, which is not the same as low.
  optional bool is_high_now = 6 [json_name = "is_high_now"];
}

// One output line: what it is called, and what "off" means for it.
message OutputLine {
  string name = 1;
  optional int32 line_index = 2 [json_name = "line_index"];
  string pin_label = 3 [json_name = "pin_label"];

  // The level this line is driven to on watchdog timeout, reset, link loss or
  // a refused graph. **Per line, because "off" is not always "low":** an
  // active-low valve driver is *opened* by a low, and a board that came up
  // driving every line low would open it on every power cycle.
  bool safe_level_is_high = 4 [json_name = "safe_level_is_high"];

  optional bool is_high_now = 5 [json_name = "is_high_now"];
}

// Every line this rig has, by name, with the board's answer folded in.
//
// **A line map is a document somebody edits**, so replacing one carries its
// text — `WriteLineMapFile` — and keeps its own schema
// (`contracts/DAEMON_LAYOUT.md` §2). This is the *reading* of it that a panel
// draws: the map, resolved against the board, with the live levels beside it.
// That join is the one thing only the daemon can do.
message LineMapView {
  repeated InputLine input_lines = 1 [json_name = "input_lines"];
  repeated OutputLine output_lines = 2 [json_name = "output_lines"];

  // Where the pin labels came from. `device` means the board answered `pins`
  // and these labels are its own; `assumed` means this daemon fell back to its
  // own table for firmware older than that command, and every label here is a
  // belief rather than a fact (`docs/reference/protocol.md` §3.6).
  string pin_labels_came_from = 3 [json_name = "pin_labels_came_from"];

  // Indexed by line number, so a client reads the board's own name for line 4
  // as `board_input_pins[4]`.
  repeated string board_input_pins = 4 [json_name = "board_input_pins"];
  repeated string board_output_pins = 5 [json_name = "board_output_pins"];
}

// One line in or out of the serial port, in the protocol's own words.
//
// **"Line" here is a line of text, not a GPIO line.** The two meanings collide
// throughout this repository — `LineMap` is wiring and `DeviceLineMonitor` is
// the port — so the interface says `Serial` where it means the port and keeps
// `line` for the wire only inside this message, where the neighbouring
// `direction` makes it unambiguous.
//
// What this is for is the moment the layers stop agreeing: the line map says
// the valve is line 3, the valve is not opening, and the question is whether
// this daemon ever sent the command. Nothing else can answer it.
message SerialMonitorEntry {
  int64 entry_number = 1 [json_name = "entry_number"];

  // `tx` or `rx`, from this daemon's point of view.
  string direction = 2;

  // The NDJSON exactly as it went, framing and all.
  string line = 3;

  string recorded_host_time = 4 [json_name = "recorded_host_time"];
}

// A window of the serial monitor's ring.
message SerialMonitorWindow {
  repeated SerialMonitorEntry entries = 1;
  int64 newest_entry_number = 2 [json_name = "newest_entry_number"];
  int64 oldest_entry_number_still_held = 3 [json_name = "oldest_entry_number_still_held"];
  int32 ring_capacity = 4 [json_name = "ring_capacity"];
  optional int64 lost_entries_before = 5 [json_name = "lost_entries_before"];
}

message ReadSerialMonitorRequest {
  int64 since_entry_number = 1 [json_name = "since_entry_number"];
  int32 limit = 2;
}

message WatchSerialMonitorRequest {
  int64 since_entry_number = 1 [json_name = "since_entry_number"];
}

// What replacing the line map did.
//
// **Where it lands, and where it does not.** The map goes to the board and
// into the loaded state-machine config *in memory*. It is not written to the
// store until somebody saves that config, and this says so — because that is
// the honest shape for a panel somebody is editing while watching a lamp: a
// wiring change has to reach the board immediately to be *checked* against the
// wire, and an edit that reached the disk on every keystroke would make
// "revert" mean nothing.
message WriteLineMapResult {
  LineMapView line_map = 1 [json_name = "line_map"];

  // False when nothing is attached. The map is still kept, and still applies
  // the moment a board greets.
  bool pushed_to_device = 2 [json_name = "pushed_to_device"];

  // Always false today, and named rather than omitted: a UI has to be able to
  // tell somebody their edit is one restart away from being lost.
  bool saved_to_the_store = 3 [json_name = "saved_to_the_store"];

  // Which config the map went into, or empty when none is loaded — a rig with
  // no config takes the map anyway and has nowhere to save it.
  string state_machine_config = 4 [json_name = "state_machine_config"];
}

// What the board is running, and what could be flashed onto it.
// What writing the board's settings to its own flash cost.
//
// **`write_count` is a budget made visible.** Data flash wears out — about
// 100,000 erase cycles on the reference board — and a rig a third of the way
// through that budget should be able to say so rather than failing one day
// with no warning.
//
// **A save that would store what is already stored writes nothing**, answers
// `written: false`, and leaves `write_count` where it was. It is answered
// rather than refused: "it is already saved" is a success, and a save button
// must not cost an erase cycle to press twice.
message SaveSettingsResult {
  bool written = 1;
  int64 write_count = 2 [json_name = "write_count"];

  // What was saved: whether there was a graph set, which version, and whether
  // autorun was on. The three things that come back after a power cut.
  bool has_set = 3 [json_name = "has_set"];
  int32 set_version = 4 [json_name = "set_version"];
  bool autorun = 5;
}

message FirmwareVersions {
  // What the board greeted with.
  string running = 1;

  // What this package ships, when it ships one.
  string installed = 2;

  // Whether the board names a stamped build at all. An unstamped image is a
  // local build, and comparing it to anything is meaningless rather than
  // false.
  bool running_is_stamped = 3 [json_name = "running_is_stamped"];

  // Whether both sides name a stamped build, so the comparison means
  // something.
  bool comparable = 4;

  // Only ever true when `comparable` is. **The comparison is the whole
  // point**: a board in a rack cannot be asked which commit it is running, so
  // the package carries a manifest and this says whether the two agree.
  bool matches = 5;
}

// Whether the board arms its own trials, and what it would run.
//
// **This is the switch that makes the daemon optional**: the device starts
// each run itself and waits out the dwell the terminal state it reached
// declared. Asked of the board rather than remembered here — the setting is
// stored on the device, outlives this daemon's session, and survives the
// greeting that took the rig away from it.
message Autorun {
  bool enabled = 1;

  // `enabled` and `active` are not the same fact: a board can be configured to
  // arm its own trials and not be doing so right now
  // (`docs/reference/protocol.md` §3.7).
  bool active = 2;

  // Which graph it runs, by name where this daemon can say it. The board holds
  // a slot; the name comes from the committed set.
  string graph_name = 3 [json_name = "graph_name"];
  int32 slot = 4;

  int32 cap_milliseconds = 5 [json_name = "cap_milliseconds"];
  int64 seed = 6;
  int64 next_trial_id = 7 [json_name = "next_trial_id"];
}

// Hand the board the job of arming its own trials, or take it back.
message WriteAutorunRequest {
  bool enabled = 1;

  // A name, never a slot — like everything else this API takes. Left out when
  // enabling, the session's active graph is used, which is the one a person
  // looking at this rig would mean.
  optional string graph_name = 2 [json_name = "graph_name"];

  int32 cap_milliseconds = 3 [json_name = "cap_milliseconds"];

  // The stream the board's own trials draw from. Left out, whatever the board
  // already holds stands — which for a board restored from its own storage is
  // the seed that makes an unattended session replay.
  optional int64 seed = 4;

  optional int64 first_trial_id = 5 [json_name = "first_trial_id"];

  // Whether to start arming trials now, or only to store the setting.
  //
  // **This is how a rig is actually set up**: enable, save, power cycle. A
  // save is refused on a board that is running, and a board arming its own
  // trials is never idle — so without a way to say "store it, do not start",
  // the setting could never be written to flash. Unset means start, which is
  // what an operator turning autorun on by hand means.
  optional bool start_now = 6 [json_name = "start_now"];
}
