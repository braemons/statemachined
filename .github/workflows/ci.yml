# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every job here calls a Makefile target. That is deliberate: a command CI runs
# and the Makefile does not is a command nobody can reproduce locally, and a
# version pinned in both places is a version that drifts. What is left in this
# file is the things only CI has -- the matrix, the caches, the artifacts.
#
# To reproduce a red build: `make ci`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-purity:
    name: the portable core stays portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-core

  core-tests:
    name: core unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: make test

  sanitizers:
    name: core unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sanitizer options are set in the Makefile, so a local run fails the
      # same way this one does.
      - run: make sanitize

  daemon:
    name: "the daemon: its tests, its generated types, clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The upload test commits every compiled set to the firmware built for
      # this machine, which `rust-test` builds first.
      - run: make rust-check

  client:
    name: "the Python client: its stubs, ruff, ty, and against the daemon"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
      # The client's suite starts the daemon cargo builds.
      - run: make rust
      - run: make client
      # The hardware suite, against the firmware built for this machine: every
      # test but the timing budgets means the same thing there.
      - run: make test-hardware TARGET=native

  # There is no job here for the trial loop across both daemons. It lives in the
  # contracts repo, in `e2e-tests/`, with the tests that are about the three daemons
  # together -- a test needing two of them has no honest home inside either, and
  # the one that used to be here cost this repository a lockfile pin on triald's
  # main branch. See contracts/e2e-tests/tests/test_the_handover_to_triald.py.

  reproducibility:
    name: golden vectors are byte-identical across compilers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make golden

  firmware-build:
    name: firmware compiles for ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [uno_r4_minima]
    steps:
      - uses: actions/checkout@v4
      # uv, not the runner's system Python: the Makefile's install targets shell
      # out to `uv tool install`, and this puts uv (and its tool shims) on PATH.
      - uses: astral-sh/setup-uv@v6
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/uv
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: make install-pio
      - run: make firmware BOARD=${{ matrix.env }}

  image:
    name: a flashable image
    # Only once the thing is known to work: an artifact somebody flashes onto a
    # rig should not exist for a commit whose tests are red.
    needs: [core-tests, firmware-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/uv
          key: pio-uno_r4_minima-${{ hashFiles('platformio.ini') }}
      - run: make install-pio
      # Builds the flashable image and writes image/MANIFEST.txt, which
      # records the commit, the sizes and the checksums next to the binaries --
      # a board in a rack cannot be asked which commit it is running.
      - run: make image
      - uses: actions/upload-artifact@v4
        with:
          name: statemachined-uno_r4_minima-${{ github.sha }}
          path: image/
          # Long enough to bisect a rig problem back through a few weeks of
          # builds, short enough not to hoard binaries forever.
          retention-days: 90

  package:
    name: the package builds, twice, to the same bytes
    # The daemon's own tests are what say the code works; this says the artifact
    # a rig installs can be built at all, and that building it twice gives the
    # same bytes. That second half fails silently -- one file carrying a
    # wall-clock timestamp is enough, and the package still installs perfectly
    # -- so it is worth a job rather than a good intention.
    #
    # amd64 only, and out of the pinned builder image rather than natively:
    # arm64 runs under qemu and costs about ten minutes, which is the release
    # workflow's business rather than every push's.
    needs: [daemon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-version.sh refuses to invent a version, so it needs the tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: make -C packaging install-nfpm
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # An explicit version, because a pull request is not a tagged commit and
      # git-version.sh is deliberately fatal about that. What is under test here
      # is the build, not the version.
      - name: Build twice and compare
        run: make -C packaging repro STATEMACHINED_VERSION=0.0.1

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The version is pinned in the Makefile, which also refuses to run
      # against any other, so the two cannot drift apart.
      - run: make install-clang-format
      - run: make format-check
