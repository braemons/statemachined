# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every job here calls a Makefile target. That is deliberate: a command CI runs
# and the Makefile does not is a command nobody can reproduce locally, and a
# version pinned in both places is a version that drifts. What is left in this
# file is the things only CI has -- the matrix, the caches, the artifacts.
#
# To reproduce a red build: `make ci` (add `make emulate` for the Renode job).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-purity:
    name: the portable core stays portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-core

  core-tests:
    name: core unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: make test

  sanitizers:
    name: core unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sanitizer options are set in the Makefile, so a local run fails the
      # same way this one does.
      - run: make sanitize

  daemon-tests:
    name: the daemon, and whole sessions against the native device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv, not the runner's system Python: the daemon is a uv project and
      # `uv run --project daemon` builds its environment from daemon/uv.lock.
      - uses: astral-sh/setup-uv@v6
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('daemon/uv.lock') }}
      # Needs the checkout rather than only the package: test_message_framing.py
      # asserts the daemon's framing against emulation/tests' copy of it, and
      # the integration tests drive whole sessions against the firmware built
      # for this machine -- which `make test-integration` builds first.
      - run: make test-integration

  reproducibility:
    name: golden vectors are byte-identical across compilers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make golden

  firmware-build:
    name: firmware compiles for ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [uno_r4_minima]
    steps:
      - uses: actions/checkout@v4
      # uv, not the runner's system Python: the Makefile's install targets shell
      # out to `uv tool install`, and this puts uv (and its tool shims) on PATH.
      - uses: astral-sh/setup-uv@v6
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/uv
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: make install-pio
      - run: make firmware BOARD=${{ matrix.env }}

  image:
    name: a flashable image
    # Only once the thing is known to work: an artifact somebody flashes onto a
    # rig should not exist for a commit whose tests are red.
    needs: [core-tests, emulation, firmware-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/uv
          key: pio-uno_r4_minima-${{ hashFiles('platformio.ini') }}
      - run: make install-pio
      # Builds the flashable image and writes image/MANIFEST.txt, which
      # records the commit, the sizes and the checksums next to the binaries --
      # a board in a rack cannot be asked which commit it is running.
      - run: make image
      - uses: actions/upload-artifact@v4
        with:
          name: statemachined-uno_r4_minima-${{ github.sha }}
          path: image/
          # Long enough to bisect a rig problem back through a few weeks of
          # builds, short enough not to hoard binaries forever.
          retention-days: 90

  emulation:
    name: the HAL runs on an emulated board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/uv
          key: pio-uno_r4_minima_sci-${{ hashFiles('platformio.ini') }}
      - run: make install-pio
      # Renode's version is pinned in the Makefile: the Robot keyword library
      # ships inside Renode, so a different Renode is a different set of
      # keywords.
      - run: make install-renode
      # Covers what the host build cannot compile: the pin map, the port
      # registers, the timer ISR, and the protocol over a real UART. It asserts
      # nothing about timing -- Renode's virtual time makes that meaningless.
      # See emulation/README.md.
      - run: make emulate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renode-logs
          path: |
            logs/
            log.html
            robot_output.xml

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The version is pinned in the Makefile, which also refuses to run
      # against any other, so the two cannot drift apart.
      - run: make install-clang-format
      - run: make format-check
