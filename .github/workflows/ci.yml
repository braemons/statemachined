name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-purity:
    name: the portable core stays portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No Arduino.h, no allocation, no std containers, no float. Cheap to
      # check and expensive to discover on a board at trial 300, and it is
      # exactly the kind of rule that erodes one convenient include at a time.
      - run: ./tools/check-core-purity.sh

  core-tests:
    name: core unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: core unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DFSMD_SANITIZE=ON
      - run: cmake --build build-san -j
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure

  reproducibility:
    name: golden vectors are byte-identical across compilers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The reproducibility claim is that a seed gives the same durations
      # everywhere. Optimisation level is the cheapest way to catch a
      # dependence on undefined behaviour or on float; the boards are checked
      # on hardware at M3 and M6.
      - name: Build at -O0 and -O3
        run: |
          for opt in -O0 -O3; do
            cmake -S . -B build$opt -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_CXX_FLAGS="$opt"
            cmake --build build$opt -j
            ctest --test-dir build$opt --output-on-failure
          done

  firmware-build:
    name: firmware compiles for ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [uno_r4_minima]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      # Demo mode is 4.6 KB of SRAM on a 32 KB board, so a rig build drops it.
      # Compiled here too, or the #else half of that switch rots unnoticed.
      - name: and again without demo mode
        run: pio run -e ${{ matrix.env }}
        env:
          PLATFORMIO_BUILD_FLAGS: -DFSMD_DEMO=0

  emulation:
    name: the HAL runs on an emulated board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-uno_r4_minima_sci-${{ hashFiles('platformio.ini') }}
      # Pinned to the devcontainer's version. The Robot keyword library ships
      # inside Renode, so a different Renode is a different set of keywords.
      - name: Install Renode
        run: |
          curl -fsSL https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz -o /tmp/renode.tar.gz
          mkdir -p /opt/renode
          sudo tar xzf /tmp/renode.tar.gz -C /opt/renode --strip-components=1
          sudo ln -s /opt/renode/renode-test /usr/local/bin/renode-test
          pip install -r /opt/renode/tests/requirements.txt
      - run: pip install platformio
      - run: pio run -e uno_r4_minima_sci
      # This covers what the host build cannot compile: the pin map, the port
      # registers, the timer ISR, and the protocol over a real UART. It asserts
      # nothing about timing -- Renode's virtual time makes that meaningless.
      # See emulation/README.md.
      - run: renode-test emulation/tests/fsmd.robot
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renode-logs
          path: |
            logs/
            log.html
            robot_output.xml

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned: clang-format's output differs between major versions, so an
      # unpinned one turns a formatting check into a version lottery. The
      # Makefile pins the same version and refuses to run against any other, so
      # if these two ever drift apart the guard fails here rather than silently
      # checking against something no contributor has.
      - run: pip install clang-format==23.1.0
      - run: make format-check
