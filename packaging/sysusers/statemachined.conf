# An unprivileged user of its own, created by systemd-sysusers rather than by a
# distro-specific adduser incantation in a maintainer script.
#
# No login shell and no home worth the name: this account exists to own one
# serial device (granted by the udev rule, not by membership of dialout or uucp)
# and one state directory (created by the unit's StateDirectory=).
u statemachined - "statemachined daemon" /var/lib/braemons/statemachined -
