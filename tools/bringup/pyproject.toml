# The bring-up CLI, as its own uv project rather than a script in the repo
# root: it is the only Python in this tree with a runtime dependency, and
# keeping that dependency inside one project means `uv run --project` builds an
# environment for it without touching the interpreter renode-test drives or the
# uv-tool sandboxes the Makefile installs.
[project]
name = "statemachined-bringup"
version = "0.1.0"
description = "Talk to a statemachined device over serial or TCP, for board bring-up"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    # serial_for_url() is why this is the only dependency: it already speaks
    # socket:// and rfc2217://, so the day a board is on a switch instead of a
    # USB cable, nothing above link.py changes.
    "pyserial>=3.5",
]

[project.scripts]
statemachined-bringup = "statemachined_bringup.cli:main"

# pytest is a dependency of the hardware suite, not of the CLI, so it lives in
# a group rather than in `dependencies`: `uv run --project` installs it for
# `make test-hardware` and leaves it out of anything that just wants to talk to
# a board.
[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
# The suite is under tests/hardware and needs a board; there is deliberately no
# host-only test directory here, because the CLI's framing comes from
# emulation/tests/ and is tested there.
testpaths = ["tests/hardware"]
markers = [
    "loopback: needs output-to-input jumper wires; see tests/hardware/test_lines.py",
]
# One device, one order. Without this, a plugin that reorders or parallelises
# would have several tests arming the same board at once.
addopts = "-p no:randomly"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statemachined_bringup"]
