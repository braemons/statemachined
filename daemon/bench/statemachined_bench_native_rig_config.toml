# The same bench, against the native device instead of a board.
#
# This is the *rig config*: what the box is. The line map and the graphs are not
# here -- they are a state-machine config under `state_machine_config_directory`
# below, written by the web UI. See daemon/src/statemachined/rig_configuration.py
# for why the split is where it is, and configs/native-device.config.json
# for the one this bench comes up loaded with.
#
# This is NOT the installed conffile. The package's is
# /etc/braemons/statemachined-rig-config.toml (dev/DAEMON.md §6.2), it is
# written by M5, and it names /var/lib paths a developer's checkout does not
# have. This one names paths under build/, which is ignored by git, so running
# the bench never dirties the tree and deleting a graph from the web UI never
# deletes an example from graphs/.
#
#     make bench-device                                        # in one terminal
#     make bench TARGET=socket://127.0.0.1:5300 \
#       BENCH_CONFIG=daemon/bench/statemachined_bench_native_rig_config.toml
#
# It differs from the board's rig config in exactly one thing that matters: the
# state-machine config it loads. `configs/native-device.config.json` carries the
# same line names and the same graphs on `sim0..sim7`, because the native build
# has no pins and says so rather than borrowing a board's labels -- so the
# reference board's map, which names D2, is refused against it. That refusal is
# correct and is the point of a map naming pins; this is the config that fits.
#
# `make bench` copies graphs/*.json and configs/*.config.json into the stores
# below on first use, so the UI has something to show before anybody has
# authored anything.

# Overridden by `make bench TARGET=...`; this default is the reference board on
# the cable it arrives on, not the /dev/braemons/statemachined0 symlink, which
# is the udev rule's and arrives with the package.
device_target = "socket://127.0.0.1:5300"
connect_on_startup = true

# Empty, and deliberately so on a bench: `make bench TARGET=socket://...` greets
# the native device, which is not an `uno_r4_minima` and should not be refused
# for saying so. A rig in a rack names its board here -- see the setting's note
# in rig_configuration.py for the failure it exists to catch.
expected_board = ""

# Nowhere: a bench box has no triald, and a daemon that could not run without
# one would be untestable exactly here.
triald_base_url = ""

# Relative to the directory make runs in, which is the repository root.
graph_store_directory = "build/bench/graphs"
state_machine_config_directory = "build/bench/configs"
trace_directory = "build/bench/trace"
recording_directory = "build/bench/recordings"

# What the bench comes up wired as. The map is pushed as soon as the board is
# greeted; the graphs do not go up until somebody opens a session, which on a
# bench is a button and on a rig is triald.
startup_state_machine_config = "native-device"
