# A bench rig, for driving the daemon and its web UI by hand.
#
# This is NOT the installed conffile. The package's is
# /etc/braemons/statemachined.toml (dev/DAEMON.md §6.2), it is written by M5,
# and it names /var/lib paths a developer's checkout does not have. This one
# names paths under build/, which is ignored by git, so running the bench never
# dirties the tree and deleting a graph from the web UI never deletes an
# example from graphs/.
#
#     make bench                     # a real board on /dev/ttyACM0
#     make bench TARGET=socket://127.0.0.1:5300    # the native device instead
#
# `make bench` copies graphs/*.json into the store below on first use, so the
# UI has something to show before anybody has authored anything.

# Overridden by `make bench TARGET=...`; this default is the reference board on
# the cable it arrives on, not the /dev/braemons/statemachined0 symlink, which
# is the udev rule's and arrives with the package.
device_target = "/dev/ttyACM0"
connect_on_startup = true

# Nowhere: a bench box has no triald, and a daemon that could not run without
# one would be untestable exactly here.
triald_base_url = ""

# Relative to the directory make runs in, which is the repository root.
graph_store_directory = "build/bench/graphs"
trace_directory = "build/bench/trace"

# The reference board's wiring, as dev/HARDWARE.md describes it. Kept identical
# to graphs/uno-r4-minima-lines.json, and a unit test says so -- two line maps
# for one board that disagree is a wire in the wrong hole at 2 a.m.
[line_map]
input_lines = [
  { name = "start_switch", line_index = 0, pin_label = "D2", debounce_milliseconds = 20 },
  { name = "abort",        line_index = 1, pin_label = "D3", debounce_milliseconds = 20 },
  { name = "lever_left",   line_index = 4, pin_label = "D6", debounce_milliseconds = 5 },
  { name = "lever_right",  line_index = 5, pin_label = "D7", debounce_milliseconds = 5 },
  { name = "lever",        line_index = 6, pin_label = "D8", debounce_milliseconds = 5 },
]
output_lines = [
  { name = "ready_lamp",   line_index = 0, pin_label = "D10" },
  { name = "cue_lamp",     line_index = 1, pin_label = "D11" },
  { name = "error_lamp",   line_index = 2, pin_label = "D12" },
  { name = "reward_valve", line_index = 3, pin_label = "A0", safe_level_is_high = true },
]
