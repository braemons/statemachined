[project]
name = "statemachined-client"
description = "Python client for statemachined — the state machine daemon's API, as types"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joscha Schmiedt" }]

# **3.11, not 3.12.** The daemon beside this one still runs on 3.11 — it is
# installed on rigs whose distribution ships that — and a client its own
# repository cannot import is not a client. This is why nothing here uses
# PEP 695 generics.
requires-python = ">=3.11"

# NOT the version of anything shipped — a deliberately invalid sentinel, as in
# the daemon beside this and in vstimd, mousewheeld and triald. The real
# version comes from the git tag and is stamped in at build time; a 0.0.0
# artifact in the wild means the stamping was bypassed.
version = "0.0.0"

# Two, and both are runtime. `grpcio` is the transport and `protobuf` is the
# generated types it carries; the stubs are committed, so `grpcio-tools` and
# protoc are a development dependency and not an installation one
# (`contracts/DAEMON_LAYOUT.md`).
#
# **Not pydantic, and that is the change.** The daemon's `statemachined.client`
# depended on the daemon's own pydantic models, which is exactly the coupling
# that kept the two in one distribution: a client that imports `model/` is a
# client that ships the daemon. The documents cross as text now, so the only
# thing describing the interface is `proto/statemachined/v1/`.
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.27",
]

# `statemachinectl`, not `statemachined`: the daemon owns that name and on a rig
# box both are installed. Two programs answering to one word is a bug report
# about the wrong one.
[project.scripts]
statemachinectl = "statemachined_client.command_line_interface:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statemachined_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
# The generated stubs are not hand-written and not reviewed as source; they are
# checked by being used, and everything that touches them is
# `_wire_conversions.py`.
exclude = ["statemachined_client/_proto"]

[tool.ruff]
line-length = 96
src = ["statemachined_client", "tests"]
# Generated by protoc and committed. A formatter with an opinion about it would
# rewrite the file and `make check-proto` would then call it stale for ever.
extend-exclude = ["statemachined_client/_proto"]

[tool.ruff.lint]
# The daemon's set, so one repository has one idea of what Python looks like.
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "RUF",
]
ignore = [
    "B008",   # function call in default argument - fine for our dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
