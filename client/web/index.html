<!doctype html>
<!--
  SPDX-License-Identifier: LGPL-3.0-or-later

  The rig's own page. Everything on it is one of the custom elements under
  /elements/, which is the same contract a console in another repo uses -- so
  this page is an honest test of that contract rather than a privileged view
  with a private route behind it.

  No framework and no CDN: a rig box may have no route to the internet and a
  browser in a booth must not wait on unpkg. There is exactly one build step --
  elements/daemon_api_client.js, generated from proto/ and committed -- so a
  checkout still runs with uv alone.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>statemachined</title>
    <link rel="stylesheet" href="/ui/statemachined_user_interface.css" />
    <script type="module" src="/ui/application_shell.js"></script>
  </head>
  <body>
    <header>
      <h1>statemachined</h1>
      <span id="rig-summary" class="summary">connecting...</span>
    </header>

    <nav id="view-navigation" aria-label="views"></nav>

    <main id="view-container"></main>

    <footer>
      Every panel here is a custom element served from
      <code>/elements/statemachined.js</code>, and everything it shows came through
      the rpcs in <code>proto/statemachined/v1/</code>. There is no private call.
    </footer>
  </body>
</html>
